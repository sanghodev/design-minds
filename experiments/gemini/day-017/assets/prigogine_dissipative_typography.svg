<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" style="background-color: #07090e; font-family: &quot;JetBrains Mono&quot;, -apple-system, sans-serif;"><defs><linearGradient id="heatGrad" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" stop-color="#ef4444" stop-opacity="0.9" /><stop offset="50%" stop-color="#f97316" stop-opacity="0.7" /><stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" /></linearGradient><linearGradient id="convectionGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" /><stop offset="100%" stop-color="#10b981" stop-opacity="0.9" /></linearGradient><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="blur" /><feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge></filter></defs><g stroke="#111827" stroke-width="1" opacity="0.6"><line x1="0" y1="0" x2="0" y2="850" /><line x1="40" y1="0" x2="40" y2="850" /><line x1="80" y1="0" x2="80" y2="850" /><line x1="120" y1="0" x2="120" y2="850" /><line x1="160" y1="0" x2="160" y2="850" /><line x1="200" y1="0" x2="200" y2="850" /><line x1="240" y1="0" x2="240" y2="850" /><line x1="280" y1="0" x2="280" y2="850" /><line x1="320" y1="0" x2="320" y2="850" /><line x1="360" y1="0" x2="360" y2="850" /><line x1="400" y1="0" x2="400" y2="850" /><line x1="440" y1="0" x2="440" y2="850" /><line x1="480" y1="0" x2="480" y2="850" /><line x1="520" y1="0" x2="520" y2="850" /><line x1="560" y1="0" x2="560" y2="850" /><line x1="600" y1="0" x2="600" y2="850" /><line x1="640" y1="0" x2="640" y2="850" /><line x1="680" y1="0" x2="680" y2="850" /><line x1="720" y1="0" x2="720" y2="850" /><line x1="760" y1="0" x2="760" y2="850" /><line x1="800" y1="0" x2="800" y2="850" /><line x1="840" y1="0" x2="840" y2="850" /><line x1="880" y1="0" x2="880" y2="850" /><line x1="920" y1="0" x2="920" y2="850" /><line x1="960" y1="0" x2="960" y2="850" /><line x1="1000" y1="0" x2="1000" y2="850" /><line x1="1040" y1="0" x2="1040" y2="850" /><line x1="1080" y1="0" x2="1080" y2="850" /><line x1="1120" y1="0" x2="1120" y2="850" /><line x1="1160" y1="0" x2="1160" y2="850" /><line x1="0" y1="0" x2="1200" y2="0" /><line x1="0" y1="40" x2="1200" y2="40" /><line x1="0" y1="80" x2="1200" y2="80" /><line x1="0" y1="120" x2="1200" y2="120" /><line x1="0" y1="160" x2="1200" y2="160" /><line x1="0" y1="200" x2="1200" y2="200" /><line x1="0" y1="240" x2="1200" y2="240" /><line x1="0" y1="280" x2="1200" y2="280" /><line x1="0" y1="320" x2="1200" y2="320" /><line x1="0" y1="360" x2="1200" y2="360" /><line x1="0" y1="400" x2="1200" y2="400" /><line x1="0" y1="440" x2="1200" y2="440" /><line x1="0" y1="480" x2="1200" y2="480" /><line x1="0" y1="520" x2="1200" y2="520" /><line x1="0" y1="560" x2="1200" y2="560" /><line x1="0" y1="600" x2="1200" y2="600" /><line x1="0" y1="640" x2="1200" y2="640" /><line x1="0" y1="680" x2="1200" y2="680" /><line x1="0" y1="720" x2="1200" y2="720" /><line x1="0" y1="760" x2="1200" y2="760" /><line x1="0" y1="800" x2="1200" y2="800" /><line x1="0" y1="840" x2="1200" y2="840" /></g><g id="header"><rect x="30" y="24" width="1140" height="72" fill="#0b0f19" stroke="#1e293b" rx="8" /><text x="50" y="48" fill="#f97316" font-size="11" font-weight="700" letter-spacing="2">DAY 017 · NON-EQUILIBRIUM THERMODYNAMICS · NOBEL PRIZE 1977</text><text x="50" y="74" fill="#f8fafc" font-size="20" font-weight="800" letter-spacing="-0.5">Prigogine Dissipative Typography: Order Through Non-Equilibrium Entropy Dissipation</text><text x="1150" y="60" fill="#64748b" font-size="11" text-anchor="end">dS = d_e S + d_i S (d_e S &lt; 0) · Rayleigh-Bénard Convection · Ilya Prigogine</text></g><g id="section1"><rect x="30" y="110" width="360" height="440" fill="#0b0f19" stroke="#1e293b" rx="8" /><text x="50" y="138" fill="#38bdf8" font-size="13" font-weight="700">1. PRIGOGINE ENTROPY DYNAMICS</text><rect x="46" y="155" width="328" height="115" fill="#111827" stroke="#374151" rx="6" /><text x="58" y="178" fill="#ef4444" font-size="11" font-weight="700">CLOSED ISOLATED SYSTEM (Clausius/Boltzmann)</text><text x="58" y="198" fill="#94a3b8" font-size="10">dS ≥ 0  (Internal entropy continuously grows)</text><text x="58" y="216" fill="#64748b" font-size="10">Textual fate: Thermal noise, typographic heat death,</text><text x="58" y="232" fill="#64748b" font-size="10">unraveling of syntax into disordered Brownian dust.</text><text x="58" y="252" fill="#ef4444" font-size="10" font-weight="600">Equilibrium = Maximum Disorder = Semantic Silence</text><rect x="46" y="280" width="328" height="145" fill="#111827" stroke="#06b6d4" rx="6" /><text x="58" y="303" fill="#06b6d4" font-size="11" font-weight="700">OPEN DISSIPATIVE SYSTEM (Ilya Prigogine)</text><text x="58" y="325" fill="#f8fafc" font-size="11" font-weight="700">dS = d_e S + d_i S</text><text x="58" y="345" fill="#10b981" font-size="10">d_e S &lt; 0 : External entropy export (Margin Radiation)</text><text x="58" y="363" fill="#f97316" font-size="10">d_i S &gt; 0 : Internal entropy production (Reading friction)</text><text x="58" y="383" fill="#eab308" font-size="10" font-weight="700">When |d_e S| &gt; d_i S  ==&gt;  dS &lt; 0 (NEGENTROPY)</text><text x="58" y="403" fill="#38bdf8" font-size="10">Spontaneous emergence of macroscopic typographic order!</text><rect x="46" y="435" width="328" height="100" fill="#0f172a" stroke="#1e293b" rx="6" /><text x="58" y="458" fill="#e2e8f0" font-size="10" font-weight="700">Entropy Production Rate: P = d_i S / dt = Σ J_k · X_k ≥ 0</text><text x="58" y="478" fill="#94a3b8" font-size="9">• J_k (Thermodynamic Flux): Saccadic reading velocity, word flow</text><text x="58" y="496" fill="#94a3b8" font-size="9">• X_k (Thermodynamic Force): Semantic cognitive gradient ∇(1/T)</text><text x="58" y="516" fill="#10b981" font-size="9" font-weight="600">Stationary state: Minimum entropy production (Prigogine theorem)</text></g><g id="section2"><rect x="405" y="110" width="410" height="440" fill="#0b0f19" stroke="#1e293b" rx="8" /><text x="425" y="138" fill="#f97316" font-size="13" font-weight="700">2. RAYLEIGH-BÉNARD CONVECTION CELLS</text><rect x="421" y="155" width="378" height="220" fill="#090d16" stroke="#334155" rx="6" /><rect x="431" y="165" width="358" height="18" fill="#0369a1" rx="3" /><text x="610" y="178" fill="#f0f9ff" font-size="10" font-weight="700" text-anchor="middle">COLD UPPER PLATE (Whitespace Margin Heat Sink: T_cold)</text><rect x="431" y="345" width="358" height="18" fill="#b91c1c" rx="3" /><text x="610" y="358" fill="#fef2f2" font-size="10" font-weight="700" text-anchor="middle">HOT BOTTOM PLATE (Gaze Saccade Friction: T_hot)</text><circle cx="490" cy="264" r="48" fill="none" stroke="url(#convectionGrad)" stroke-width="2.5" stroke-dasharray="8,4" /><circle cx="610" cy="264" r="48" fill="none" stroke="url(#heatGrad)" stroke-width="2.5" stroke-dasharray="8,4" /><circle cx="730" cy="264" r="48" fill="none" stroke="url(#convectionGrad)" stroke-width="2.5" stroke-dasharray="8,4" /><path d="M 490 340 L 490 190" stroke="#ef4444" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)" /><path d="M 550 190 L 550 340" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" /><path d="M 670 190 L 670 340" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" /><path d="M 730 340 L 730 190" stroke="#ef4444" stroke-width="2" stroke-linecap="round" /><text x="490" y="268" fill="#f8fafc" font-size="13" font-weight="900" text-anchor="middle">ORDER</text><text x="610" y="268" fill="#f97316" font-size="13" font-weight="800" text-anchor="middle">FLUX</text><text x="730" y="268" fill="#38bdf8" font-size="13" font-weight="900" text-anchor="middle">NEUS</text><rect x="421" y="388" width="378" height="147" fill="#111827" stroke="#374151" rx="6" /><text x="433" y="408" fill="#eab308" font-size="11" font-weight="700">RAYLEIGH NUMBER &amp; CRITICAL BIFURCATION</text><text x="433" y="428" fill="#f8fafc" font-size="10">Ra = (g · α · ΔT · d³) / (ν · κ)  ;  Critical Threshold Ra_c ≈ 1708</text><text x="433" y="448" fill="#94a3b8" font-size="9">• Ra &lt; Ra_c : Conduction regime. Pure thermodynamic branch.</text><text x="433" y="464" fill="#64748b" font-size="9">   Letters remain linear, static, uniform; entropy quietly accumulates.</text><text x="433" y="482" fill="#10b981" font-size="9" font-weight="700">• Ra &gt; Ra_c : Far-from-equilibrium bifurcation!</text><text x="433" y="498" fill="#a7f3d0" font-size="9">   Symmetry breaks spontaneously into hexagonal convection cells.</text><text x="433" y="516" fill="#38bdf8" font-size="9">   Reading friction drives macroscopic coherent typographical vortices.</text></g><g id="section3"><rect x="830" y="110" width="340" height="440" fill="#0b0f19" stroke="#1e293b" rx="8" /><text x="850" y="138" fill="#10b981" font-size="13" font-weight="700">3. EDITORIAL THERMAL ENGINE</text><rect x="846" y="155" width="308" height="80" fill="#111827" stroke="#f97316" rx="6" /><text x="858" y="176" fill="#f97316" font-size="10" font-weight="700">STAGE I: READING FRICTION (Q_in)</text><text x="858" y="194" fill="#e2e8f0" font-size="9">Saccades &amp; cursor drags inject kinetic friction heat.</text><text x="858" y="210" fill="#94a3b8" font-size="9">Local temperature T rises; tracking begins to vibrate.</text><text x="858" y="226" fill="#64748b" font-size="9">Micro-fluctuations enter non-linear feedback loop.</text><rect x="846" y="245" width="308" height="85" fill="#111827" stroke="#06b6d4" rx="6" /><text x="858" y="266" fill="#06b6d4" font-size="10" font-weight="700">STAGE II: MARGIN RADIATION (Q_out)</text><text x="858" y="284" fill="#e2e8f0" font-size="9">Whitespace margins act as black-body radiators.</text><text x="858" y="300" fill="#94a3b8" font-size="9">dS_margin = dQ / T_sink ; Heat is radiated outwards.</text><text x="858" y="316" fill="#38bdf8" font-size="9">Preserves internal document negentropy dS &lt; 0.</text><rect x="846" y="340" width="308" height="95" fill="#111827" stroke="#10b981" rx="6" /><text x="858" y="361" fill="#10b981" font-size="10" font-weight="700">STAGE III: DISSIPATIVE STRUCTURE</text><text x="858" y="379" fill="#f8fafc" font-size="9" font-weight="600">Bifurcation into steady-state convective honeycomb.</text><text x="858" y="395" fill="#94a3b8" font-size="9">Font weight thickens along rising convective plumes;</text><text x="858" y="411" fill="#94a3b8" font-size="9">Kerning tightens inside cell cores, creating macroscopic</text><text x="858" y="427" fill="#10b981" font-size="9" font-weight="700">self-stabilizing editorial hierarchy out of chaos!</text><rect x="846" y="445" width="308" height="90" fill="#0f172a" stroke="#334155" rx="6" /><text x="858" y="467" fill="#e2e8f0" font-size="10" font-weight="700">THERMODYNAMIC CARNOT BOUNDS</text><text x="858" y="487" fill="#94a3b8" font-size="9">Cognitive Efficiency: η_th = 1 - (T_sink / T_gaze)</text><text x="858" y="505" fill="#94a3b8" font-size="9">Onsager Reciprocity: L_ij = L_ji (Heat-Semantics symmetry)</text><text x="858" y="523" fill="#eab308" font-size="9">Self-organization requires continuous energy throughput.</text></g><g id="section4"><rect x="30" y="565" width="1140" height="250" fill="#0b0f19" stroke="#1e293b" rx="8" /><text x="50" y="592" fill="#f8fafc" font-size="13" font-weight="700">4. COMPARATIVE MATRIX: GUTENBERG STATIC LEAD vs. PRIGOGINE DISSIPATIVE TYPOGRAPHY</text><rect x="46" y="605" width="1108" height="26" fill="#1e293b" rx="4" /><text x="60" y="622" fill="#e2e8f0" font-size="10" font-weight="700">ONTOLOGICAL PROPERTY</text><text x="270" y="622" fill="#e2e8f0" font-size="10" font-weight="700">GUTENBERG STATIC LEAD (1450)</text><text x="570" y="622" fill="#e2e8f0" font-size="10" font-weight="700">THERMAL EQUILIBRIUM (Closed)</text><text x="850" y="622" fill="#e2e8f0" font-size="10" font-weight="700">PRIGOGINE DISSIPATIVE (Open/Far-from-Eq)</text><rect x="46" y="631" width="1108" height="22" fill="#111827" rx="2" /><text x="60" y="645" fill="#94a3b8" font-size="9" font-weight="600">System Boundary</text><text x="270" y="645" fill="#64748b" font-size="9">Closed, isolated lead slug</text><text x="570" y="645" fill="#ef4444" font-size="9">Closed thermodynamic chamber</text><text x="850" y="645" fill="#f8fafc" font-size="9" font-weight="700">Open system exchanging energy &amp; entropy</text><rect x="46" y="655" width="1108" height="22" fill="#0b0f19" rx="2" /><text x="60" y="669" fill="#94a3b8" font-size="9" font-weight="600">Entropy Dynamics</text><text x="270" y="669" fill="#64748b" font-size="9">Static frozen structure (dS = 0)</text><text x="570" y="669" fill="#ef4444" font-size="9">Monotonic decay to maximum chaos (dS &gt; 0)</text><text x="850" y="669" fill="#38bdf8" font-size="9" font-weight="700">Continuous entropy export: dS = d_e S + d_i S &lt; 0</text><rect x="46" y="679" width="1108" height="22" fill="#111827" rx="2" /><text x="60" y="693" fill="#94a3b8" font-size="9" font-weight="600">Time Invariance</text><text x="270" y="693" fill="#64748b" font-size="9">Reversible, timeless, static artifact</text><text x="570" y="693" fill="#ef4444" font-size="9">Irreversible heat death (Clausius)</text><text x="850" y="693" fill="#f97316" font-size="9" font-weight="700">Irreversible historical arrow of time (T-breaking)</text><rect x="46" y="703" width="1108" height="22" fill="#0b0f19" rx="2" /><text x="60" y="717" fill="#94a3b8" font-size="9" font-weight="600">Order Genesis</text><text x="270" y="717" fill="#64748b" font-size="9">Imposed externally by the typesetter</text><text x="570" y="717" fill="#ef4444" font-size="9">Thermal noise, complete loss of signal</text><text x="850" y="717" fill="#10b981" font-size="9" font-weight="700">Spontaneous self-organization (Bénard cells)</text><rect x="46" y="727" width="1108" height="22" fill="#111827" rx="2" /><text x="60" y="741" fill="#94a3b8" font-size="9" font-weight="600">Response to Stress</text><text x="270" y="741" fill="#64748b" font-size="9">Rigid brittleness; fractures on stress</text><text x="570" y="741" fill="#ef4444" font-size="9">Disintegration into Brownian noise</text><text x="850" y="741" fill="#eab308" font-size="9" font-weight="700">Bifurcation into higher-order convective coherence</text><text x="50" y="795" fill="#475569" font-size="9">REFERENCES: Ilya Prigogine (1977) "Self-Organization in Nonequilibrium Systems" · G. Nicolis &amp; I. Prigogine (1989) "Exploring Complexity" · E. Schrödinger (1944) "What is Life?"</text></g></svg>