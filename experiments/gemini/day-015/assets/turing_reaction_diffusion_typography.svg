<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0c1017" />
      <stop offset="100%" stop-color="#080a0f" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1f293d" stroke-width="0.7" opacity="0.35"/>
    </pattern>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="850" fill="url(#bgGrad)" />
  <rect width="1200" height="850" fill="url(#gridPattern)" />

  <!-- Outer Structural Border -->
  <rect x="25" y="25" width="1150" height="800" fill="none" stroke="#1e293b" stroke-width="1.5" rx="8" />
  <rect x="35" y="35" width="1130" height="780" fill="none" stroke="#0f172a" stroke-width="1" rx="4" />

  <!-- Header Section -->
  <g transform="translate(55, 75)">
    <text font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="11" font-weight="700" fill="#06b6d4" letter-spacing="3">DESIGN MINDS · NOON MIND PROTOCOL · DAY 015</text>
    <text y="30" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="24" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">Turing Morphogenesis &amp; Reaction-Diffusion Typography</text>
    <text y="52" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Nonlinear Activator-Inhibitor Partial Differential Equations (Gray-Scott System) · Pearson Parameter Space</text>
  </g>

  <!-- Status / Metric Badge (Top Right) -->
  <g transform="translate(930, 65)">
    <rect x="0" y="0" width="210" height="58" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="15" y="22" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">DIFFUSION REGIME</text>
    <text x="15" y="42" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#06b6d4">GRAY-SCOTT LABYRINTH</text>
    <circle cx="185" cy="28" r="6" fill="#06b6d4" filter="url(#neonGlow)" />
  </g>

  <!-- Left Column: The Governing Partial Differential Equations -->
  <g transform="translate(55, 160)">
    <rect x="0" y="0" width="340" height="420" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="28" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">1. TURING CHEMICAL KINETICS</text>
    <text x="20" y="46" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Continuous Reaction-Diffusion System (1952)</text>

    <!-- Mathematical Equation Boxes -->
    <g transform="translate(20, 65)">
      <!-- Morphogen U Equation (Inhibitor / Feed) -->
      <rect x="0" y="0" width="300" height="64" rx="4" fill="#070a11" stroke="#1e293b" />
      <text x="15" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8">SUBSTRATE / INHIBITOR (U):</text>
      <text x="15" y="46" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#f8fafc">∂u/∂t = Du ∇²u - uv² + F(1 - u)</text>
    </g>

    <g transform="translate(20, 140)">
      <!-- Morphogen V Equation (Activator) -->
      <rect x="0" y="0" width="300" height="64" rx="4" fill="#070a11" stroke="#1e293b" />
      <text x="15" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#ec4899">AUTOCATALYTIC ACTIVATOR (V):</text>
      <text x="15" y="46" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#f8fafc">∂v/∂t = Dv ∇²v + uv² - (F + k)v</text>
    </g>

    <!-- 2D Discrete Laplacian Convolution Kernel -->
    <g transform="translate(20, 225)">
      <text font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#94a3b8">DISCRETE 9-POINT LAPLACIAN (∇²):</text>
      <g transform="translate(60, 18)">
        <!-- 3x3 Stencil -->
        <rect x="0" y="0" width="40" height="26" fill="#1e293b" rx="2"/>
        <text x="20" y="17" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8" text-anchor="middle">0.05</text>
        <rect x="44" y="0" width="40" height="26" fill="#1e293b" rx="2"/>
        <text x="64" y="17" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8" text-anchor="middle">0.20</text>
        <rect x="88" y="0" width="40" height="26" fill="#1e293b" rx="2"/>
        <text x="108" y="17" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8" text-anchor="middle">0.05</text>

        <rect x="0" y="30" width="40" height="26" fill="#1e293b" rx="2"/>
        <text x="20" y="47" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8" text-anchor="middle">0.20</text>
        <rect x="44" y="30" width="40" height="26" fill="#3b82f6" rx="2"/>
        <text x="64" y="47" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f8fafc" text-anchor="middle">-1.00</text>
        <rect x="88" y="30" width="40" height="26" fill="#1e293b" rx="2"/>
        <text x="108" y="47" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8" text-anchor="middle">0.20</text>

        <rect x="0" y="60" width="40" height="26" fill="#1e293b" rx="2"/>
        <text x="20" y="77" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8" text-anchor="middle">0.05</text>
        <rect x="44" y="60" width="40" height="26" fill="#1e293b" rx="2"/>
        <text x="64" y="77" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8" text-anchor="middle">0.20</text>
        <rect x="88" y="60" width="40" height="26" fill="#1e293b" rx="2"/>
        <text x="108" y="77" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8" text-anchor="middle">0.05</text>
      </g>
    </g>

    <text x="20" y="355" font-family="'Inter', sans-serif" font-size="10.5" fill="#94a3b8">
      Diffusion rates require Du &gt; Dv (Du = 0.2097, Dv = 0.1050, ratio ≈ 2:1). Short-range activation coupled with long-range inhibition breaks spatial symmetry to self-organize living patterns.
    </text>
  </g>

  <!-- Center Column: Pearson Parameter Space (F, k) Morphology Map -->
  <g transform="translate(420, 160)">
    <rect x="0" y="0" width="370" height="420" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="28" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ec4899" letter-spacing="1">2. PEARSON PARAMETER SPACE (F, k)</text>
    <text x="20" y="46" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Morphological Phase Regimes in Chemical Space</text>

    <!-- Coordinate Grid for F vs k -->
    <g transform="translate(40, 70)">
      <!-- Axes -->
      <line x1="0" y1="200" x2="280" y2="200" stroke="#475569" stroke-width="1.5" />
      <line x1="0" y1="0" x2="0" y2="200" stroke="#475569" stroke-width="1.5" />
      <text x="285" y="204" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Feed (F)</text>
      <text x="-5" y="-10" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Kill (k)</text>

      <!-- Tick marks -->
      <text x="0" y="215" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">0.01</text>
      <text x="90" y="215" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">0.03</text>
      <text x="180" y="215" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">0.05</text>
      <text x="270" y="215" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">0.07</text>

      <text x="-25" y="200" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">0.04</text>
      <text x="-25" y="100" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">0.06</text>
      <text x="-25" y="15" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">0.07</text>

      <!-- Phase Zone Alpha: Solitary Spots / Cheetah -->
      <g transform="translate(90, 80)">
        <circle cx="0" cy="0" r="28" fill="#f59e0b" opacity="0.25" />
        <circle cx="0" cy="0" r="4" fill="#f59e0b" />
        <text x="8" y="4" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#f59e0b">SPOTS (F=0.030, k=0.062)</text>
        <text x="8" y="15" font-family="'Inter', sans-serif" font-size="8" fill="#cbd5e1">Cheetah dappling / Stippled glyphs</text>
      </g>

      <!-- Phase Zone Beta: Labyrinthine Ribbons / Zebra -->
      <g transform="translate(130, 95)">
        <ellipse cx="0" cy="0" rx="35" ry="24" fill="#06b6d4" opacity="0.25" />
        <circle cx="0" cy="0" r="4" fill="#06b6d4" filter="url(#neonGlow)" />
        <text x="8" y="-4" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#06b6d4">STRIPES (F=0.037, k=0.060)</text>
        <text x="8" y="7" font-family="'Inter', sans-serif" font-size="8" fill="#cbd5e1">Zebra lines / Labyrinth corridors</text>
      </g>

      <!-- Phase Zone Gamma: Mitotic Division -->
      <g transform="translate(75, 125)">
        <circle cx="0" cy="0" r="24" fill="#ec4899" opacity="0.25" />
        <circle cx="0" cy="0" r="4" fill="#ec4899" />
        <text x="8" y="4" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#ec4899">MITOSIS (F=0.026, k=0.055)</text>
        <text x="8" y="15" font-family="'Inter', sans-serif" font-size="8" fill="#cbd5e1">Self-replicating dividing letters</text>
      </g>

      <!-- Phase Zone Delta: Chaos / Spirals -->
      <g transform="translate(35, 160)">
        <circle cx="0" cy="0" r="20" fill="#8b5cf6" opacity="0.2" />
        <circle cx="0" cy="0" r="3" fill="#8b5cf6" />
        <text x="8" y="4" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#a78bfa">TURBULENCE (F=0.014, k=0.047)</text>
      </g>
    </g>

    <!-- Morphology Descriptions -->
    <g transform="translate(20, 310)">
      <rect x="0" y="0" width="330" height="90" rx="4" fill="#070a11" stroke="#1e293b" />
      <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#f8fafc">BIOLOGICAL VARIABLE FONT AXIS:</text>
      <text x="12" y="34" font-family="'Inter', sans-serif" font-size="9.5" fill="#94a3b8">
        Modulating (F, k) acts as an organic typographic variation axis:
      </text>
      <text x="12" y="50" font-family="'JetBrains Mono', monospace" font-size="9" fill="#06b6d4">• F: 0.037 → 0.030 : Stems dissolve into discrete stippled dots.</text>
      <text x="12" y="66" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ec4899">• k: 0.060 → 0.055 : Serifs sprout tendrils that undergo cell mitosis.</text>
      <text x="12" y="82" font-family="'JetBrains Mono', monospace" font-size="9" fill="#f59e0b">• Wavelength λ_T = 2π√(Du·Dv / fu·gv) governs baseline rhythm.</text>
    </g>
  </g>

  <!-- Right Column: Morphogenetic Typographic Evolution Timeline -->
  <g transform="translate(815, 160)">
    <rect x="0" y="0" width="330" height="420" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="28" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#10b981" letter-spacing="1">3. GLYPH MORPHOGENESIS</text>
    <text x="20" y="46" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Temporal Evolution of Seed 'T' (t_0 → t_final)</text>

    <!-- 3 Stage Timeline Cards -->
    <!-- Stage 0: Initial Seed -->
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="290" height="75" rx="4" fill="#070a11" stroke="#1e293b" />
      <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#38bdf8">t = 0 (INOCULATION)</text>
      <!-- Glyphic representation of crisp T -->
      <path d="M 30 30 L 70 30 L 70 38 L 54 38 L 54 62 L 46 62 L 46 38 L 30 38 Z" fill="#38bdf8" />
      <text x="85" y="38" font-family="'Inter', sans-serif" font-size="9.5" fill="#f8fafc">Sharp Bézier Vector</text>
      <text x="85" y="52" font-family="'Inter', sans-serif" font-size="8.5" fill="#64748b">High V activator concentration on stems</text>
    </g>

    <!-- Stage 1: Autocatalytic Budding -->
    <g transform="translate(20, 150)">
      <rect x="0" y="0" width="290" height="75" rx="4" fill="#070a11" stroke="#1e293b" />
      <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#ec4899">t = 500 (BUDDING INSTABILITY)</text>
      <!-- Budded T with spots/stripes -->
      <path d="M 28 30 Q 50 24 72 30 Q 75 36 68 39 Q 56 37 54 45 L 54 62 Q 45 66 46 58 Q 46 45 32 39 Z" fill="#ec4899" />
      <circle cx="24" cy="28" r="3" fill="#ec4899" />
      <circle cx="76" cy="32" r="3" fill="#ec4899" />
      <text x="85" y="38" font-family="'Inter', sans-serif" font-size="9.5" fill="#f8fafc">Serifs Sprout Tendrils</text>
      <text x="85" y="52" font-family="'Inter', sans-serif" font-size="8.5" fill="#64748b">Turing instability triggers wave fission</text>
    </g>

    <!-- Stage 2: Homeostatic Labyrinth Equilibrium -->
    <g transform="translate(20, 235)">
      <rect x="0" y="0" width="290" height="95" rx="4" fill="#070a11" stroke="#10b981" stroke-width="0.8" />
      <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#10b981">t = 2500 (ZEBRA-LABYRINTH EQUILIBRIUM)</text>
      <!-- Labyrinthine T -->
      <g transform="translate(25, 28)">
        <path d="M 0 5 Q 12 0, 25 5 Q 38 0, 50 5" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
        <path d="M 5 15 Q 25 10, 45 15" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
        <path d="M 25 22 L 25 55 Q 32 60 25 65" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
        <circle cx="12" cy="38" r="4" fill="#10b981" />
        <circle cx="38" cy="42" r="4" fill="#10b981" />
      </g>
      <text x="85" y="42" font-family="'Inter', sans-serif" font-size="9.5" fill="#f8fafc">Self-Organizing Biome</text>
      <text x="85" y="56" font-family="'Inter', sans-serif" font-size="8.5" fill="#94a3b8">Legibility preserved by homeostatic</text>
      <text x="85" y="68" font-family="'Inter', sans-serif" font-size="8.5" fill="#94a3b8">diffusion-reaction balance.</text>
    </g>

    <text x="20" y="355" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">
      Glyphic meaning does not degrade into chaotic entropy; instead, Turing's equations establish a stable homeostatic boundary where text becomes a living epidermal organism.
    </text>
  </g>

  <!-- Bottom Section: Cross-Disciplinary Synthesis & Ecological Typographic Principle -->
  <g transform="translate(55, 605)">
    <rect x="0" y="0" width="1090" height="190" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
    <text x="25" y="28" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#f8fafc" letter-spacing="1">4. THE BIOMORPHIC TYPOGRAPHY PARADIGM (ALAN TURING 1952)</text>
    <text x="25" y="46" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">The Chemical Basis of Morphogenesis Applied to Semantic Form</text>

    <!-- Comparison Matrix: Mechanical Typography vs. Morphogenetic Typography -->
    <g transform="translate(25, 65)">
      <!-- Left Box: Classical Bézier Model -->
      <rect x="0" y="0" width="505" height="105" rx="4" fill="#070a11" stroke="#334155" />
      <text x="15" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#94a3b8">TRADITIONAL BÉZIER VECTOR MODEL (1960s-PRESENT)</text>
      <text x="15" y="38" font-family="'Inter', sans-serif" font-size="9.5" fill="#64748b">• Representation: Static polynomial curve control points (P0, P1, P2, P3).</text>
      <text x="15" y="54" font-family="'Inter', sans-serif" font-size="9.5" fill="#64748b">• Medium: Frictionless Euclidean Cartesian coordinate space.</text>
      <text x="15" y="70" font-family="'Inter', sans-serif" font-size="9.5" fill="#64748b">• Reaction to Damage: Fatal raster corruption, missing glyph fragments.</text>
      <text x="15" y="86" font-family="'Inter', sans-serif" font-size="9.5" fill="#64748b">• Nature: Dead architecture, passive ink sticker on glass.</text>

      <!-- Right Box: Turing Morphogenetic Model -->
      <rect x="535" y="0" width="505" height="105" rx="4" fill="#070a11" stroke="#06b6d4" stroke-width="1.2" />
      <text x="15" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#06b6d4">TURING REACTION-DIFFUSION MODEL (DAY 015)</text>
      <text x="15" y="38" font-family="'Inter', sans-serif" font-size="9.5" fill="#e2e8f0">• Representation: Continuous chemical concentration fields u(x,y) and v(x,y).</text>
      <text x="15" y="54" font-family="'Inter', sans-serif" font-size="9.5" fill="#e2e8f0">• Medium: Active biochemical substrate with local feedback and dissipation.</text>
      <text x="15" y="70" font-family="'Inter', sans-serif" font-size="9.5" fill="#e2e8f0">• Reaction to Damage: Autonomous self-healing via activator replenishment.</text>
      <text x="15" y="86" font-family="'Inter', sans-serif" font-size="9.5" fill="#10b981">• Nature: Living skin, self-organizing linguistic membrane.</text>
    </g>
  </g>

  <!-- Footer Watermark & Credentials -->
  <g transform="translate(55, 825)">
    <text font-family="'JetBrains Mono', monospace" font-size="9" fill="#475569">
      AUTONOMOUS RESEARCH CORPUS · DESIGN MINDS BY GEMINI (NOON MIND) · MATHEMATICAL EQUATIONS GROUNDED IN TURING (1952) &amp; GRAY-SCOTT (1983)
    </text>
  </g>
