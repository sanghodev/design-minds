<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%" style="background-color: #0b0f17; font-family: 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Technical Blueprint Grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#151d2a" stroke-width="1"/>
      <path d="M 150 0 L 0 0 0 150" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    </pattern>
    
    <!-- Gradients -->
    <linearGradient id="woodPlank" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d2b1f"/>
      <stop offset="50%" stop-color="#543d2b"/>
      <stop offset="100%" stop-color="#2d1f16"/>
    </linearGradient>
    <linearGradient id="bronzeMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="interiorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Grid Background -->
  <rect width="1200" height="850" fill="url(#grid)" />

  <!-- Blueprint Header Border -->
  <rect x="40" y="30" width="1120" height="65" fill="#111827" stroke="#1f2937" stroke-width="1.5" rx="4"/>
  <text x="65" y="62" fill="#f59e0b" font-size="15" font-weight="900" letter-spacing="3">FORENSIC ARCHAEOLOGY // THE TROJAN HORSE (ΔΟΥΡΕΙΟΣ ΙΠΠΟΣ)</text>
  <text x="65" y="80" fill="#94a3b8" font-size="11" letter-spacing="1">HOMERIC TIMBER SIEGE ENGINE · MOUNT IDA FIR TRUSS · 40 HOPLITE CAPACITY</text>
  <text x="1130" y="70" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="end">SCALE: 1:50 · ELEVATION: +11.2m</text>

  <!-- Dimension Lines -->
  <!-- Height (11.20m) -->
  <line x1="80" y1="120" x2="80" y2="760" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="72" y1="120" x2="88" y2="120" stroke="#475569" stroke-width="2"/>
  <line x1="72" y1="760" x2="88" y2="760" stroke="#475569" stroke-width="2"/>
  <text x="65" y="440" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(-90 65 440)" letter-spacing="2">CREST HEIGHT: 11.20 METERS</text>

  <!-- Ground Line & Wheels Track -->
  <line x1="120" y1="765" x2="1100" y2="765" stroke="#334155" stroke-width="3"/>
  <line x1="220" y1="785" x2="1000" y2="785" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="220" y1="778" x2="220" y2="792" stroke="#475569" stroke-width="2"/>
  <line x1="1000" y1="778" x2="1000" y2="792" stroke="#475569" stroke-width="2"/>
  <text x="610" y="810" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="2">WHEELBASE LENGTH: 14.80 METERS · TRACK: 4.10m (SCAEAN GATE 3.2m BREACH)</text>

  <!-- THE TROJAN HORSE ANATOMICAL TIMBER STRUCTURE -->
  <g id="horse-structure">
    
    <!-- 1. TAIL: Heavy Twisted Hemp Cable Tail -->
    <path d="M 230 450 C 190 480, 160 560, 175 640 C 180 670, 200 690, 205 660 C 210 610, 220 540, 250 490 Z" 
          fill="#332419" stroke="#523a28" stroke-width="2"/>

    <!-- 2. REAR HIND LEGS (Behind) -->
    <path d="M 330 480 L 305 600 L 290 710 L 270 740 L 330 740 L 345 680 L 360 590 L 375 490 Z" 
          fill="#251a12" stroke="#3d2b1f" stroke-width="1.5"/>

    <!-- 3. FRONT FORELEGS (Behind) -->
    <path d="M 820 480 L 805 590 L 800 690 L 780 740 L 840 740 L 850 680 L 855 580 L 870 480 Z" 
          fill="#251a12" stroke="#3d2b1f" stroke-width="1.5"/>

    <!-- 4. REAR HIND LEGS (Foreground - Anatomically Curved Hock & Stifle) -->
    <path d="M 270 450 C 240 500, 260 580, 245 640 C 235 680, 230 720, 220 745 L 295 745 C 310 715, 315 675, 325 640 C 340 585, 355 520, 340 450 Z" 
          fill="#4a3525" stroke="#e6edf3" stroke-width="2"/>
    <!-- Leg Timber Bracing Bands -->
    <line x1="250" y1="550" x2="335" y2="530" stroke="#f59e0b" stroke-width="2"/>
    <line x1="240" y1="650" x2="320" y2="640" stroke="#f59e0b" stroke-width="2"/>

    <!-- 5. FRONT FORELEGS (Foreground - Straight Muscular Timber Pillars) -->
    <path d="M 745 460 C 750 520, 755 580, 750 640 L 740 745 L 815 745 C 820 700, 825 640, 825 580 C 825 520, 815 470, 805 440 Z" 
          fill="#4a3525" stroke="#e6edf3" stroke-width="2"/>
    <!-- Leg Timber Bracing Bands -->
    <line x1="750" y1="540" x2="825" y2="540" stroke="#f59e0b" stroke-width="2"/>
    <line x1="745" y1="650" x2="820" y2="650" stroke="#f59e0b" stroke-width="2"/>

    <!-- 6. HORSE TORSO & BARREL (Main Body Shell) -->
    <!-- Massive Curved Equine Silhouette: Flank, Rump, Back, Withers, Shoulder, Breast, Underbelly -->
    <path d="M 260 440 
             C 240 370, 280 290, 360 270 
             C 450 250, 560 260, 680 230 
             C 710 180, 750 140, 800 115 
             C 830 100, 870 95, 900 110 
             C 930 125, 955 160, 970 200 
             C 985 240, 970 270, 930 290 
             C 890 310, 850 300, 820 340 
             C 800 370, 830 420, 840 460 
             C 790 490, 720 500, 650 500 
             C 520 500, 420 510, 350 490 
             C 290 470, 270 455, 260 440 Z" 
          fill="url(#woodPlank)" stroke="#e6edf3" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- 7. HORSE HEAD & CREST DETAILS -->
    <!-- Equine Ears -->
    <polygon points="870,95 890,50 910,95" fill="#543d2b" stroke="#e6edf3" stroke-width="2"/>
    <polygon points="895,100 915,60 930,105" fill="#3d2b1f" stroke="#e6edf3" stroke-width="1.5"/>

    <!-- Muzzle, Nostril & Jawline -->
    <path d="M 970 200 C 990 220, 1005 245, 995 265 C 985 285, 955 295, 930 290 L 890 270" fill="none" stroke="#e6edf3" stroke-width="2.5"/>
    <!-- The Hidden Ventilation Slit (Horse Nostril) -->
    <ellipse cx="985" cy="245" rx="5" ry="9" transform="rotate(-25 985 245)" fill="#10b981" stroke="#34d399" stroke-width="2"/>

    <!-- Segmented Wooden Mane Planks along Crest -->
    <path d="M 720 230 L 740 190 L 760 220 L 780 170 L 805 200 L 825 150 L 850 180 L 870 115" 
          fill="none" stroke="#f59e0b" stroke-width="3"/>

    <!-- Eye Ornamentation (Dedication Plaque to Athena) -->
    <circle cx="915" cy="170" r="10" fill="#111827" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="915" cy="170" r="4" fill="#f59e0b"/>

    <!-- Horizontal Timber Hull Planking Lines (Revealing Shipwright Construction) -->
    <path d="M 285 360 C 400 340, 600 340, 800 370" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="8 4"/>
    <path d="M 315 410 C 450 390, 620 390, 770 420" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="8 4"/>
    <path d="M 345 460 C 460 440, 580 440, 720 465" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="8 4"/>

    <!-- 8. CUTAWAY: INTERNAL ABDOMINAL CAVITY (HOPLITE COMPARTMENT) -->
    <rect x="370" y="320" width="370" height="150" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 3"/>
    <rect x="370" y="320" width="370" height="150" rx="8" fill="url(#interiorGlow)"/>

    <!-- Structural Floor Platform & Keel -->
    <rect x="360" y="465" width="390" height="12" fill="#78350f" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Trapdoor Hatch on Belly -->
    <rect x="520" y="465" width="70" height="12" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <text x="555" y="495" fill="#ef4444" font-size="10" font-weight="bold" text-anchor="middle">SECRET ESCAPE HATCH</text>

    <!-- 40 Greek Hoplites Crouched Inside Matrix -->
    <g id="soldiers-cutaway">
      <!-- 4 Rows of 10 Warriors in Bronze Helmets & Shields -->
      <!-- We render stylized crouched hoplite silhouettes -->
      <!-- Row 1 -->
      <g fill="#f59e0b" stroke="#b45309" stroke-width="0.5">
        <circle cx="400" cy="350" r="7"/><circle cx="435" cy="350" r="7"/><circle cx="470" cy="350" r="7"/><circle cx="505" cy="350" r="7"/><circle cx="540" cy="350" r="7"/><circle cx="575" cy="350" r="7"/><circle cx="610" cy="350" r="7"/><circle cx="645" cy="350" r="7"/><circle cx="680" cy="350" r="7"/><circle cx="715" cy="350" r="7"/>
      </g>
      <!-- Row 2 -->
      <g fill="#f59e0b" stroke="#b45309" stroke-width="0.5">
        <circle cx="400" cy="385" r="7"/><circle cx="435" cy="385" r="7"/><circle cx="470" cy="385" r="7"/><circle cx="505" cy="385" r="7"/><circle cx="540" cy="385" r="7"/><circle cx="575" cy="385" r="7"/><circle cx="610" cy="385" r="7"/><circle cx="645" cy="385" r="7"/><circle cx="680" cy="385" r="7"/><circle cx="715" cy="385" r="7"/>
      </g>
      <!-- Row 3 -->
      <g fill="#f59e0b" stroke="#b45309" stroke-width="0.5">
        <circle cx="400" cy="420" r="7"/><circle cx="435" cy="420" r="7"/><circle cx="470" cy="420" r="7"/><circle cx="505" cy="420" r="7"/><circle cx="540" cy="420" r="7"/><circle cx="575" cy="420" r="7"/><circle cx="610" cy="420" r="7"/><circle cx="645" cy="420" r="7"/><circle cx="680" cy="420" r="7"/><circle cx="715" cy="420" r="7"/>
      </g>
      <!-- Row 4 -->
      <g fill="#f59e0b" stroke="#b45309" stroke-width="0.5">
        <circle cx="400" cy="450" r="7"/><circle cx="435" cy="450" r="7"/><circle cx="470" cy="450" r="7"/><circle cx="505" cy="450" r="7"/><circle cx="540" cy="450" r="7"/><circle cx="575" cy="450" r="7"/><circle cx="610" cy="450" r="7"/><circle cx="645" cy="450" r="7"/><circle cx="680" cy="450" r="7"/><circle cx="715" cy="450" r="7"/>
      </g>
      <!-- Bronze Spears angled across compartment -->
      <line x1="380" y1="460" x2="720" y2="340" stroke="#d97706" stroke-width="1.5" opacity="0.6"/>
      <line x1="390" y1="460" x2="730" y2="340" stroke="#d97706" stroke-width="1.5" opacity="0.6"/>
    </g>

    <!-- 9. MASSIVE WHEEL ASSEMBLIES (Heavy Spoked Wooden Wheels on Iron Axles) -->
    <!-- Rear Wheel -->
    <g id="rear-wheel" transform="translate(255, 745)">
      <circle cx="0" cy="0" r="46" fill="#1e293b" stroke="#d97706" stroke-width="6"/>
      <circle cx="0" cy="0" r="38" fill="#0f172a" stroke="#78350f" stroke-width="2"/>
      <circle cx="0" cy="0" r="14" fill="#d97706"/>
      <!-- Wheel Spokes -->
      <line x1="-38" y1="0" x2="38" y2="0" stroke="#94a3b8" stroke-width="3"/>
      <line x1="0" y1="-38" x2="0" y2="38" stroke="#94a3b8" stroke-width="3"/>
      <line x1="-27" y1="-27" x2="27" y2="27" stroke="#94a3b8" stroke-width="3"/>
      <line x1="-27" y1="27" x2="27" y2="-27" stroke="#94a3b8" stroke-width="3"/>
    </g>

    <!-- Front Wheel -->
    <g id="front-wheel" transform="translate(780, 745)">
      <circle cx="0" cy="0" r="46" fill="#1e293b" stroke="#d97706" stroke-width="6"/>
      <circle cx="0" cy="0" r="38" fill="#0f172a" stroke="#78350f" stroke-width="2"/>
      <circle cx="0" cy="0" r="14" fill="#d97706"/>
      <!-- Wheel Spokes -->
      <line x1="-38" y1="0" x2="38" y2="0" stroke="#94a3b8" stroke-width="3"/>
      <line x1="0" y1="-38" x2="0" y2="38" stroke="#94a3b8" stroke-width="3"/>
      <line x1="-27" y1="-27" x2="27" y2="27" stroke="#94a3b8" stroke-width="3"/>
      <line x1="-27" y1="27" x2="27" y2="-27" stroke="#94a3b8" stroke-width="3"/>
    </g>
  </g>

  <!-- CALLOUT LABELS & FORENSIC SPECS -->
  <!-- Nostril Ventilation Callout -->
  <path d="M 985 245 L 1060 210 L 1140 210" fill="none" stroke="#34d399" stroke-width="1.5"/>
  <circle cx="985" cy="245" r="4" fill="#34d399"/>
  <text x="1060" y="195" fill="#34d399" font-size="11" font-weight="bold">CONCEALED VENTILATION APERTURE</text>
  <text x="1060" y="228" fill="#94a3b8" font-size="10">Nostril Micro-Slit: 4.5 cm² Area</text>
  <text x="1060" y="243" fill="#94a3b8" font-size="10">Air Exchange: 22.4 Liters / Minute</text>

  <!-- Hoplite Chamber Callout -->
  <path d="M 550 320 L 550 200 L 400 200" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="550" cy="320" r="4" fill="#f59e0b"/>
  <text x="390" y="190" fill="#f59e0b" font-size="12" font-weight="bold" text-anchor="end">HOPLITE HULL PAYLOAD</text>
  <text x="390" y="208" fill="#e2e8f0" font-size="11" text-anchor="end">40 Greek Champions in Full Bronze Panoply</text>
  <text x="390" y="224" fill="#94a3b8" font-size="10" text-anchor="end">Biomass &amp; Armor: 4,120 kg · Chamber: 38.4 m³</text>
  <text x="390" y="240" fill="#ef4444" font-size="10" font-weight="bold" text-anchor="end">Critical Hypoxia Limit: 9.2 Hours (Unventilated)</text>

  <!-- Wall Breach Callout -->
  <path d="M 780 745 L 940 700 L 1020 700" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="780" cy="745" r="4" fill="#38bdf8"/>
  <text x="940" y="685" fill="#38bdf8" font-size="11" font-weight="bold">WHEELBASE VS. SCAEAN GATE</text>
  <text x="940" y="718" fill="#94a3b8" font-size="10">Horse Track Width: 4.10 Meters</text>
  <text x="940" y="733" fill="#94a3b8" font-size="10">Scaean Gate Width: 3.20 Meters (Schliemann Excavation)</text>
  <text x="940" y="748" fill="#f59e0b" font-size="10" font-weight="bold">Conclusion: City Wall Dismantlement Was Required</text>
</svg>
