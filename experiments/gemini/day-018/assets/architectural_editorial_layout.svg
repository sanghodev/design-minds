<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" style="background-color: #f7f5f0; font-family: &quot;JetBrains Mono&quot;, -apple-system, sans-serif;"><defs><filter id="planeShadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="6" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" /></filter><filter id="deepShadow" x="-15%" y="-15%" width="140%" height="140%"><feDropShadow dx="12" dy="18" stdDeviation="16" flood-color="#002fa7" flood-opacity="0.15" /></filter></defs><g stroke="#e5e0d8" stroke-width="1" opacity="0.75"><line x1="0" y1="0" x2="0" y2="850" /><line x1="30" y1="0" x2="30" y2="850" /><line x1="60" y1="0" x2="60" y2="850" /><line x1="90" y1="0" x2="90" y2="850" /><line x1="120" y1="0" x2="120" y2="850" /><line x1="150" y1="0" x2="150" y2="850" /><line x1="180" y1="0" x2="180" y2="850" /><line x1="210" y1="0" x2="210" y2="850" /><line x1="240" y1="0" x2="240" y2="850" /><line x1="270" y1="0" x2="270" y2="850" /><line x1="300" y1="0" x2="300" y2="850" /><line x1="330" y1="0" x2="330" y2="850" /><line x1="360" y1="0" x2="360" y2="850" /><line x1="390" y1="0" x2="390" y2="850" /><line x1="420" y1="0" x2="420" y2="850" /><line x1="450" y1="0" x2="450" y2="850" /><line x1="480" y1="0" x2="480" y2="850" /><line x1="510" y1="0" x2="510" y2="850" /><line x1="540" y1="0" x2="540" y2="850" /><line x1="570" y1="0" x2="570" y2="850" /><line x1="600" y1="0" x2="600" y2="850" /><line x1="630" y1="0" x2="630" y2="850" /><line x1="660" y1="0" x2="660" y2="850" /><line x1="690" y1="0" x2="690" y2="850" /><line x1="720" y1="0" x2="720" y2="850" /><line x1="750" y1="0" x2="750" y2="850" /><line x1="780" y1="0" x2="780" y2="850" /><line x1="810" y1="0" x2="810" y2="850" /><line x1="840" y1="0" x2="840" y2="850" /><line x1="870" y1="0" x2="870" y2="850" /><line x1="900" y1="0" x2="900" y2="850" /><line x1="930" y1="0" x2="930" y2="850" /><line x1="960" y1="0" x2="960" y2="850" /><line x1="990" y1="0" x2="990" y2="850" /><line x1="1020" y1="0" x2="1020" y2="850" /><line x1="1050" y1="0" x2="1050" y2="850" /><line x1="1080" y1="0" x2="1080" y2="850" /><line x1="1110" y1="0" x2="1110" y2="850" /><line x1="1140" y1="0" x2="1140" y2="850" /><line x1="1170" y1="0" x2="1170" y2="850" /><line x1="0" y1="0" x2="1200" y2="0" /><line x1="0" y1="30" x2="1200" y2="30" /><line x1="0" y1="60" x2="1200" y2="60" /><line x1="0" y1="90" x2="1200" y2="90" /><line x1="0" y1="120" x2="1200" y2="120" /><line x1="0" y1="150" x2="1200" y2="150" /><line x1="0" y1="180" x2="1200" y2="180" /><line x1="0" y1="210" x2="1200" y2="210" /><line x1="0" y1="240" x2="1200" y2="240" /><line x1="0" y1="270" x2="1200" y2="270" /><line x1="0" y1="300" x2="1200" y2="300" /><line x1="0" y1="330" x2="1200" y2="330" /><line x1="0" y1="360" x2="1200" y2="360" /><line x1="0" y1="390" x2="1200" y2="390" /><line x1="0" y1="420" x2="1200" y2="420" /><line x1="0" y1="450" x2="1200" y2="450" /><line x1="0" y1="480" x2="1200" y2="480" /><line x1="0" y1="510" x2="1200" y2="510" /><line x1="0" y1="540" x2="1200" y2="540" /><line x1="0" y1="570" x2="1200" y2="570" /><line x1="0" y1="600" x2="1200" y2="600" /><line x1="0" y1="630" x2="1200" y2="630" /><line x1="0" y1="660" x2="1200" y2="660" /><line x1="0" y1="690" x2="1200" y2="690" /><line x1="0" y1="720" x2="1200" y2="720" /><line x1="0" y1="750" x2="1200" y2="750" /><line x1="0" y1="780" x2="1200" y2="780" /><line x1="0" y1="810" x2="1200" y2="810" /><line x1="0" y1="840" x2="1200" y2="840" /></g><g fill="#a8a29e" font-size="9" font-weight="500"><text x="60" y="16">SEC-0060 // MOD-Φ</text><text x="240" y="16">SEC-0240 // MOD-Φ</text><text x="420" y="16">SEC-0420 // MOD-Φ</text><text x="600" y="16">SEC-0600 // MOD-Φ</text><text x="780" y="16">SEC-0780 // MOD-Φ</text><text x="960" y="16">SEC-0960 // MOD-Φ</text><text x="1140" y="16">SEC-1140 // MOD-Φ</text></g><g id="header"><rect x="30" y="30" width="1140" height="76" fill="#ffffff" stroke="#d6d3d1" rx="4" filter="url(#planeShadow)" /><text x="50" y="54" fill="#002fa7" font-size="11" font-weight="700" letter-spacing="2">DAY 018 · ARCHITECTURAL FRONT-END PARADIGM · TECTONIC EDITORIAL</text><text x="50" y="82" fill="#141413" font-size="22" font-weight="800" letter-spacing="-0.5" font-family="Georgia, serif">Kinetic Architectural Editorial Layouts: Transcending the Frictionless Web Scroll</text><text x="1150" y="68" fill="#78716c" font-size="11" text-anchor="end">Le Corbusier Modulor · El Lissitzky Proun · 3D Folding Tectonics · Tactile Linen Medium</text></g><g id="axonometric-planes"><rect x="30" y="125" width="480" height="450" fill="#ffffff" stroke="#d6d3d1" rx="6" filter="url(#planeShadow)" /><text x="50" y="155" fill="#002fa7" font-size="13" font-weight="700">1. AXONOMETRIC FOLDING TECTONICS (3D SPATIAL PLANES)</text><polygon points="80,480 320,530 460,450 220,400" fill="#f5f2eb" stroke="#d6d3d1" stroke-width="1.5" /><text x="260" y="475" fill="#78716c" font-size="10" font-weight="600">PLANE 0: DATUM BASELINE</text><polygon points="120,380 360,430 420,310 180,260" fill="#ede8dd" stroke="#141413" stroke-width="2" filter="url(#planeShadow)" /><text x="270" y="355" fill="#141413" font-size="12" font-weight="800" font-family="Georgia, serif">FOLD I: EDITORIAL CANTILEVER</text><polygon points="160,280 400,330 450,220 210,170" fill="#002fa7" stroke="#001a61" stroke-width="2" filter="url(#deepShadow)" /><text x="300" y="255" fill="#ffffff" font-size="13" font-weight="800" font-family="Georgia, serif">PLANE II: MONUMENTAL ACCENT</text><g stroke="#ff3b00" stroke-width="1.5" stroke-dasharray="4,4"><line x1="80" y1="480" x2="160" y2="280" /><line x1="320" y1="530" x2="400" y2="330" /><line x1="460" y1="450" x2="450" y2="220" /><line x1="220" y1="400" x2="210" y2="170" /></g><rect x="50" y="505" width="440" height="55" fill="#f8fafc" stroke="#e2e8f0" rx="4" /><text x="65" y="524" fill="#475569" font-size="9" font-weight="600">• Viewport as 3D Architectural Envelope: CSS perspective: 1200px</text><text x="65" y="542" fill="#64748b" font-size="9">• Interactive kinetic hinges rotate editorial planes along X/Y axes on scroll/drag.</text></g><g id="modulor-editorial"><rect x="530" y="125" width="640" height="450" fill="#ffffff" stroke="#d6d3d1" rx="6" filter="url(#planeShadow)" /><text x="550" y="155" fill="#141413" font-size="13" font-weight="700">2. LE CORBUSIER MODULOR &amp; SPATIAL RATIOS (Φ = 1.618)</text><g id="modulor-boxes"><rect x="550" y="175" width="380" height="235" fill="#faf8f5" stroke="#002fa7" stroke-width="2" /><rect x="550" y="175" width="235" height="235" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5" /><text x="667" y="295" fill="#141413" font-size="16" font-weight="800" text-anchor="middle" font-family="Georgia, serif">HERO SLAB (Φ²)</text><rect x="785" y="175" width="145" height="145" fill="#ede8dd" stroke="#d6d3d1" stroke-width="1.5" /><text x="857" y="255" fill="#141413" font-size="11" font-weight="700" text-anchor="middle">CANTILEVER (Φ)</text><rect x="785" y="320" width="90" height="90" fill="#002fa7" stroke="#001a61" stroke-width="1.5" /><text x="830" y="370" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">INDEX</text><rect x="875" y="320" width="55" height="90" fill="#ff3b00" stroke="#c52e00" stroke-width="1.5" /><text x="902" y="370" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">№ 18</text></g><g id="modulor-info"><rect x="950" y="175" width="200" height="235" fill="#f5f2eb" stroke="#d6d3d1" rx="4" /><text x="965" y="200" fill="#002fa7" font-size="11" font-weight="700">RED / BLUE SERIES</text><text x="965" y="225" fill="#141413" font-size="11" font-weight="800">1130 mm</text><text x="965" y="239" fill="#78716c" font-size="9">Primary Grid Unit (Main Col)</text><text x="965" y="261" fill="#141413" font-size="11" font-weight="800">698 mm</text><text x="965" y="275" fill="#78716c" font-size="9">Secondary Cantilever</text><text x="965" y="297" fill="#002fa7" font-size="11" font-weight="800">432 mm</text><text x="965" y="311" fill="#78716c" font-size="9">Typography Column Width</text><text x="965" y="333" fill="#78716c" font-size="11" font-weight="800">267 mm</text><text x="965" y="347" fill="#78716c" font-size="9">Tactile Margin Suture</text><text x="965" y="369" fill="#ff3b00" font-size="11" font-weight="800">165 mm</text><text x="965" y="383" fill="#78716c" font-size="9">Baseline Harmonic Stride</text></g><rect x="550" y="430" width="600" height="130" fill="#fafaf9" stroke="#e7e5e4" rx="4" /><text x="565" y="452" fill="#1c1917" font-size="10" font-weight="700">ARCHITECTURAL FRONT-END PRINCIPLES:</text><text x="565" y="472" fill="#44403c" font-size="9">1. Non-Linear Folding: Content unfolds as 3D hinged facets rather than vertical tape.</text><text x="565" y="490" fill="#44403c" font-size="9">2. Tactile Materiality: Warm Alabaster (#f7f5f0) cotton paper and blind-debossed micro-shadows.</text><text x="565" y="508" fill="#44403c" font-size="9">3. Cantilever Balance: Dramatic asymmetrical overhangs grounded by deep Yves Klein Blue accents.</text><text x="565" y="528" fill="#002fa7" font-size="9" font-weight="700">Pioneering a completely new visual paradigm for digital editorial design.</text></g><g id="taxonomy-matrix"><rect x="30" y="595" width="1140" height="225" fill="#ffffff" stroke="#d6d3d1" rx="6" filter="url(#planeShadow)" /><text x="50" y="622" fill="#141413" font-size="13" font-weight="700">3. FRONT-END PARADIGM SHIFT: CONVENTIONAL WEB SCROLL vs. KINETIC ARCHITECTURAL EDITORIAL</text><rect x="46" y="635" width="1108" height="26" fill="#141413" rx="3" /><text x="60" y="652" fill="#ffffff" font-size="10" font-weight="700">ARCHITECTURAL DIMENSION</text><text x="280" y="652" fill="#ffffff" font-size="10" font-weight="700">CONVENTIONAL WEB LAYOUT (12-COL TAPE)</text><text x="680" y="652" fill="#ffffff" font-size="10" font-weight="700">KINETIC ARCHITECTURAL EDITORIAL (PARADIGM SHIFT)</text><rect x="46" y="661" width="1108" height="22" fill="#fafaf9" rx="2" /><text x="60" y="675" fill="#78716c" font-size="9" font-weight="600">Spatial Coordinate System</text><text x="280" y="675" fill="#a8a29e" font-size="9">Flat 1D linear vertical tape (Y-axis only)</text><text x="680" y="675" fill="#002fa7" font-size="9" font-weight="700">3D spatial envelope with Z-depth, isometric cantilevers, and dynamic perspective</text><rect x="46" y="685" width="1108" height="22" fill="#ffffff" rx="2" /><text x="60" y="699" fill="#78716c" font-size="9" font-weight="600">Visual Materiality</text><text x="280" y="699" fill="#a8a29e" font-size="9">Sterile flat pixels, arbitrary border-radius, generic drop shadows</text><text x="680" y="699" fill="#141413" font-size="9" font-weight="700">Tactile architectural paper texture, debossed letterpress relief, warm alabaster</text><rect x="46" y="709" width="1108" height="22" fill="#fafaf9" rx="2" /><text x="60" y="723" fill="#78716c" font-size="9" font-weight="600">Editorial Hierarchy</text><text x="280" y="723" fill="#a8a29e" font-size="9">Uniform container cards, rigid bootstrap breakpoints</text><text x="680" y="723" fill="#ff3b00" font-size="9" font-weight="700">Le Corbusier Modulor harmonic intervals (Φ), dramatic cantilever overhangs</text><rect x="46" y="733" width="1108" height="22" fill="#ffffff" rx="2" /><text x="60" y="747" fill="#78716c" font-size="9" font-weight="600">Interactive Kinetics</text><text x="280" y="747" fill="#a8a29e" font-size="9">Frictionless momentum scrolling with passive wheel</text><text x="680" y="747" fill="#002fa7" font-size="9" font-weight="700">Tactile plane folding, 3D hinged facet rotations, tactile paper creasing</text><rect x="46" y="757" width="1108" height="22" fill="#fafaf9" rx="2" /><text x="60" y="771" fill="#78716c" font-size="9" font-weight="600">Emotional Atmosphere</text><text x="280" y="771" fill="#a8a29e" font-size="9">SaaS dashboard uniformity, clinical cold white/dark mode</text><text x="680" y="771" fill="#141413" font-size="9" font-weight="700">Prestigious architectural monograph, physical presence, intellectual aesthetic gravity</text><text x="50" y="808" fill="#a8a29e" font-size="9">REFERENCES: Le Corbusier (1948) "The Modulor" · El Lissitzky (1920) "Proun" · Emil Ruder (1967) "Typographie" · Rem Koolhaas (1978) "Delirious New York"</text></g></svg>